name: API Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: pytest tests/ --html=report.html --self-contained-html
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
